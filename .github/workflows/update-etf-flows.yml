name: Update BTC ETF flows

on:
  workflow_dispatch:
  schedule:
    # 分批检查收盘后的报道，容忍数据发布延迟；每次最多六页公开查询。
    - cron: "17 1,5,9 * * 2-6"

permissions:
  contents: write

concurrency:
  group: update-btc-etf-flows
  cancel-in-progress: false

jobs:
  update-etf-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and normalize ETF flows
        id: collect
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          ETF_FLOW_BACKUP_URL: ${{ secrets.ETF_FLOW_BACKUP_URL }}
          ETF_FLOW_BACKUP_KEY: ${{ secrets.ETF_FLOW_BACKUP_KEY }}
          ETF_FLOW_BACKUP_LABEL: ${{ vars.ETF_FLOW_BACKUP_LABEL }}
          ETF_FLOW_BACKUP_SOURCE_URL: ${{ vars.ETF_FLOW_BACKUP_SOURCE_URL }}
        run: node scripts/update-etf-flows.mjs
      - name: Commit updated public data
        # Publish a failed check as well, without hiding the failed collection step.
        if: ${{ !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        run: |
          if git diff --quiet -- etf-flows.json etf-flows-health.json; then
            echo "No ETF update available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etf-flows.json etf-flows-health.json
          git commit -m "data: update BTC ETF flows and collection health"
          node scripts/push-snapshot.mjs
