name: Update Strategy mNAV

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-strategy-mnav.yml"
      - "scripts/update-strategy-mnav.mjs"
      - "mnav-source.js"
      - "strategy-mnav.json"
  schedule:
    # 美股周一至周五收盘后更新；BTC 价格取任务执行时的最新值。
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-strategy-mnav-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Calculate latest-methodology Strategy mNAV
        run: node scripts/update-strategy-mnav.mjs
      - name: Commit changed automatic snapshot
        run: |
          if git diff --quiet -- strategy-mnav.json dashboard.json; then
            echo "No Strategy mNAV update available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategy-mnav.json dashboard.json
          git commit -m "data: update Strategy mNAV snapshot"
          git push
