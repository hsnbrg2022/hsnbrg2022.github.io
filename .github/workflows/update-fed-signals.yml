name: Update Fed signals

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-fed-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read official Federal Reserve sources
        run: node scripts/update-fed-signals.mjs
      - name: Commit changed Fed data
        run: |
          if git diff --quiet -- fed-signals.json dashboard.json; then
            echo "No Fed update available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fed-signals.json dashboard.json
          git commit -m "data: update official Fed signals"
          git push
